spring.application.name=mokdo-backend

# PostgreSQL
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Server
server.port=8081
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Google Login
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid

# Replace DB host, database name and username before deployment
spring.datasource.url=jdbc:postgresql://change_value:5432/change_value
spring.datasource.username=change_value
spring.jpa.show-sql=false

# Replace with the production Google OAuth client ID and HTTPS URLs
spring.security.oauth2.client.registration.google.client-id=change_value
spring.security.oauth2.client.registration.google.redirect-uri=https://change-value.example/login/oauth2/code/google
app.frontend-url=https://change-value.example
server.servlet.session.cookie.secure=true
