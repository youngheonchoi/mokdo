spring.application.name=mokdo-backend

# PostgreSQL
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Server
server.port=8081
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Google Login
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid

# Shared development PostgreSQL (Neon); use the direct JDBC connection URL.
spring.datasource.url=jdbc:postgresql://ep-morning-snow-beibnep0.c-9.us-east-2.aws.neon.tech:5432/mokdo-dev?sslmode=require&channelBinding=require
spring.datasource.username=mokdo-dev_owner
spring.jpa.show-sql=true

# Replace with the local Google OAuth client ID (not a secret)
spring.security.oauth2.client.registration.google.client-id=173834286923-smbionje0eg4c95f8ala0uoq2rduu0k1.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google
app.frontend-url=http://localhost:8080

# Local asset directory. Relative paths are resolved from the backend working directory.
app.assets.path=${ASSET_PATH:../local-assets}
