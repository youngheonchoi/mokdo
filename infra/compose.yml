services:
  postgres:
    image: postgres:17
    container_name: mokdo-postgres
    environment:
      POSTGRES_DB: mokdo
      POSTGRES_USER: mokdo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
